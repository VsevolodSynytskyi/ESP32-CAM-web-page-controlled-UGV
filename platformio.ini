; ESP32-CAM web page controlled UGV
;
; AI-Thinker ESP32-CAM (on ESP32-CAM-MB USB shield) + TB6612FNG dual motor driver.
;
;   export PATH="$HOME/.platformio/penv/bin:$PATH"
;   pio run -t upload -t monitor

[platformio]
name = ESP32-CAM web page controlled UGV
description = Tracked UGV on an AI-Thinker ESP32-CAM: MJPEG video and real-time bidirectional throttle to a phone browser over SoftAP.

[env:esp32cam]
; Pinned deliberately. Platform 7.0.1 pins framework-arduinoespressif32 to
; ~3.20017.0, which is Arduino-ESP32 core 2.0.17. That core uses the
; ledcSetup/ledcAttachPin/ledcWrite(channel, duty) API. Core 3.x replaced it
; with ledcAttach/ledcWrite(pin, duty), which will NOT compile against
; motors.cpp. Do not unpin without porting that file.
platform = espressif32 @ 7.0.1
board = esp32cam
framework = arduino

; The esp32cam board definition already supplies -DBOARD_HAS_PSRAM,
; -mfix-esp32-psram-cache-issue and huge_app.csv. Restated here so it is visible.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Only ever talk to a real USB serial adapter. Without this, PlatformIO's
; auto-detect falls back to macOS's built-in pseudo-ports
; (/dev/cu.debug-console, /dev/cu.Bluetooth-Incoming-Port). Those open fine and
; return nothing, so esptool reports "No serial data received" - which reads
; like a boot-mode problem when the board is simply not plugged in.
upload_port = /dev/cu.*serial*
monitor_port = /dev/cu.*serial*

; Drop to 115200 if the MB shield's CH340 drops out mid-upload.
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3

; esp32-camera ships prebuilt inside the Arduino core
; (tools/sdk/esp32/lib/libesp32-camera.a), so there are no lib_deps.
