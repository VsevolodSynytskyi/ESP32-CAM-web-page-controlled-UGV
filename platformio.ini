; ESP32-CAM web page controlled UGV
;
; AI-Thinker ESP32-CAM (on ESP32-CAM-MB USB shield) + TB6612FNG dual motor driver.
; Streams MJPEG video and takes real-time bidirectional throttle over WebSocket.
;
; Each build stage is its own environment, selected via build_src_filter, so every
; stage stays flashable forever as a debugging tool. When Stage 4 misbehaves, reflash
; stage1a_camera_probe or stage2_motors_serial to isolate hardware from firmware.
;
;   pio run -e stage0_blink         -t upload   ; LED + serial: proves the upload path
;   pio run -e stage1a_camera_probe -t upload   ; camera only, no WiFi
;   pio run -e stage1b_stream       -t upload   ; MJPEG over STA to a laptop
;   pio run -e stage2_motors_serial -t upload   ; motors via serial, wheels OFF the ground
;   pio run -e stage3_ap_video      -t upload   ; SoftAP + web page + video
;   pio run -e stage4_full          -t upload   ; + WebSocket throttle control
;
; pio is not on PATH:  export PATH="$HOME/.platformio/penv/bin:$PATH"

[platformio]
name = ESP32-CAM web page controlled UGV
description = Tracked UGV on an AI-Thinker ESP32-CAM: MJPEG video and real-time bidirectional throttle to a phone browser over SoftAP.

; Change this as you progress through the stages, or always pass -e explicitly.
default_envs = stage0_blink

[env]
; Pinned deliberately. Platform 7.0.1 pins framework-arduinoespressif32 to ~3.20017.0,
; which is Arduino-ESP32 core 2.0.17. That core uses the ledcSetup/ledcAttachPin/
; ledcWrite(channel, duty) API. Core 3.x replaced it with ledcAttach/ledcWrite(pin, duty),
; which will NOT compile against motors.cpp. Do not unpin without updating motors.cpp.
platform = espressif32 @ 7.0.1
board = esp32cam
framework = arduino

; The esp32cam board definition already supplies -DBOARD_HAS_PSRAM,
; -mfix-esp32-psram-cache-issue and huge_app.csv. Restated here so it is visible.
board_build.partitions = huge_app.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Drop to 115200 if the MB shield's CH340 drops out mid-upload.
upload_speed = 460800

build_flags =
    -DCORE_DEBUG_LEVEL=3

; esp32-camera ships prebuilt inside the Arduino core
; (tools/sdk/esp32/lib/libesp32-camera.a), so there are no lib_deps for this project.

; ---------------------------------------------------------------------------
; Stage 0 - toolchain + hardware verification
; ---------------------------------------------------------------------------
[env:stage0_blink]
build_src_filter = +<*> -<stages/> +<stages/stage0_blink.cpp>

; ---------------------------------------------------------------------------
; Stage 1a - camera bring-up, no networking at all
; ---------------------------------------------------------------------------
[env:stage1a_camera_probe]
build_src_filter = +<*> -<stages/> +<stages/stage1a_camera_probe.cpp>

; ---------------------------------------------------------------------------
; Stage 1b - MJPEG stream over station mode, viewed on a laptop
; ---------------------------------------------------------------------------
[env:stage1b_stream]
build_src_filter = +<*> -<stages/> +<stages/stage1b_stream.cpp>

; ---------------------------------------------------------------------------
; Stage 2 - motors driven from serial. No camera, no WiFi.
; ---------------------------------------------------------------------------
[env:stage2_motors_serial]
build_src_filter = +<*> -<stages/> +<stages/stage2_motors_serial.cpp>

; ---------------------------------------------------------------------------
; Stage 3 - SoftAP + web page + video on the phone. No motor control yet.
; ---------------------------------------------------------------------------
[env:stage3_ap_video]
build_src_filter = +<*> -<stages/> +<stages/stage3_ap_video.cpp>

; ---------------------------------------------------------------------------
; Stage 4 - the shipping firmware: video + WebSocket throttle control
; ---------------------------------------------------------------------------
[env:stage4_full]
build_src_filter = +<*> -<stages/> +<stages/stage4_full.cpp>
